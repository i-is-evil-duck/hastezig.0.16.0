<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PasteBin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="https://www.nerdfonts.com/assets/css/webfont.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #fff0f5;
            color: #4a4a4a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 0;
            cursor: none;
        }
        input, textarea, select, [contenteditable], pre, code {
            cursor: text !important;
        }
        a, button, .dot {
            cursor: none !important;
        }
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            max-width: 100%;
            width: 100%;
        }
        .editor-container {
            background: #ffffff;
            border: 2px solid #ffd1dc;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(255, 105, 180, 0.15);
            display: flex;
            flex-direction: column;
            flex: 1;
        }
        .editor-header {
            background: #ffe4ec;
            padding: 4px 16px;
            border-bottom: 1px solid #ffd1dc;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }
        .dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            position: relative;
            transition: opacity 0.2s, transform 0.2s;
        }
        .dot:hover {
            opacity: 0.7;
            transform: scale(1.2);
        }
        .dot.red { background: #ff8fa3; }
        .dot.red:hover::after {
            content: '\00d7';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px;
            font-weight: bold;
            color: #fff;
            line-height: 1;
        }
        .dot.yellow { background: #ffd93d; }
        .dot.green { background: #6bcb77; }
        .editor-title {
            margin-left: 10px;
            color: #c08090;
            font-size: 0.85rem;
        }
        textarea {
            flex: 1;
            width: 100%;
            min-height: 0;
            background: #ffffff;
            color: #4a4a4a;
            border: none;
            padding: 6px 20px;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            resize: none;
            outline: none;
        }
        textarea::placeholder {
            color: #d0b0b8;
        }
        .char-bar {
            display: flex;
            align-items: center;
            padding: 2px 16px;
            background: #ffe4ec;
            border-top: 1px solid #ffd1dc;
            flex-shrink: 0;
            gap: 10px;
            flex-wrap: wrap;
        }
        .char-bar .bar-btn {
            background: #ff69b4;
            color: white;
            border: none;
            padding: 2px 8px;
            font-size: 0.7rem;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-weight: 600;
            text-decoration: none;
            display: inline-block;
            line-height: 1.4;
        }
        .char-bar .bar-btn:hover {
            background: #ff1493;
            transform: translateY(-1px);
        }
        .char-bar .bar-btn.secondary {
            background: transparent;
            color: #c08090;
            border: 1px solid #ffc0d4;
        }
        .char-bar .bar-btn.secondary:hover {
            color: #ff69b4;
            border-color: #ff69b4;
        }
        .char-count {
            margin-left: auto;
            color: #c08090;
            font-size: 0.8rem;
            white-space: nowrap;
        }
        .result {
            margin-top: 16px;
            padding: 16px;
            background: #ffffff;
            border: 2px solid #ff69b4;
            border-radius: 12px;
            display: none;
        }
        .result.show {
            display: block;
        }
        .result a {
            color: #ff69b4;
            word-break: break-all;
        }
        .result a:hover {
            text-decoration: underline;
        }
        .error {
            color: #ff4757;
            margin-top: 10px;
        }
        .paste-view {
            background: #ffffff;
            border: 2px solid #ffd1dc;
            border-radius: 16px;
            padding: 20px;
            margin-top: 16px;
            white-space: pre-wrap;
            font-family: 'Fira Code', 'Consolas', monospace;
            font-size: 14px;
            line-height: 1.6;
            overflow-x: auto;
            display: none;
        }
        .paste-view.show {
            display: block;
        }

        /* ---------- custom cursor ---------- */
        .ffb-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 56px;
            height: 56px;
            background: url("https://furryfemboys.top/cursor.png") no-repeat center / contain;
            pointer-events: none;
            user-select: none;
            z-index: 2147483647;
            transform: translate(-28px, -28px);
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        /* ---------- sparkle cursor trail ---------- */
        .ffb-sparkle-trail {
            position: fixed;
            pointer-events: none;
            z-index: 2147483647;
            font-size: 14px;
            animation: ffb-sparkle-fade 0.9s ease-out forwards;
            transform: translate(-50%, -50%);
            user-select: none;
        }
        @keyframes ffb-sparkle-fade {
            0%   { transform: translate(-50%, -50%) scale(0) rotate(0deg); opacity: 1; }
            50%  { transform: translate(-50%, -50%) scale(1.3) rotate(180deg); opacity: 1; }
            100% { transform: translate(-50%, -50%) scale(0.4) rotate(360deg); opacity: 0; }
        }

        @media (hover: none) and (pointer: coarse) {
            body, a, button, .dot { cursor: auto; }
            .ffb-cursor { display: none; }
        }
        @media (prefers-reduced-motion: reduce) {
            .ffb-cursor { display: none; }
            body { cursor: auto; }
            a, button, .dot { cursor: auto; }
        }
    </style>
</head>
<body>
    <div class="ffb-cursor" id="ffbCursor" aria-hidden="true"></div>

    <div class="container">
        <div class="editor-container">
            <div class="editor-header">
                <div class="dot red" id="dot-new" title="New paste"></div>
                <div class="dot yellow" id="dot-raw" title="View raw"></div>
                <div class="dot green" id="dot-save" title="Save paste"></div>
                <span class="editor-title" id="editorTitle">new_paste.txt</span>
            </div>
            <textarea id="pasteContent" placeholder="Paste your code or text here..."></textarea>
            <div class="char-bar">
                <button class="bar-btn" onclick="submitPaste()">Create</button>
                <a class="bar-btn secondary" href="/">New</a>
                <button class="bar-btn secondary" onclick="viewRaw()">View Raw</button>
                <span class="char-count" id="charCount">0 characters</span>
            </div>
        </div>

        <div class="result" id="result"></div>
        <div class="paste-view" id="pasteView"></div>
    </div>

    <script>
        const textarea = document.getElementById('pasteContent');
        const charCount = document.getElementById('charCount');

        textarea.addEventListener('input', () => {
            charCount.textContent = textarea.value.length + ' characters';
        });

        document.getElementById('dot-new').addEventListener('click', () => {
            const p = window.location.pathname;
            if (p.startsWith('/p/')) {
                window.location.href = '/';
            } else {
                textarea.value = '';
                charCount.textContent = '0 characters';
                document.getElementById('editorTitle').textContent = 'new_paste.txt';
                document.getElementById('result').className = 'result';
            }
        });

        document.getElementById('dot-raw').addEventListener('click', () => { viewRaw(); });

        document.getElementById('dot-save').addEventListener('click', () => { submitPaste(); });

        async function submitPaste() {
            const content = textarea.value;
            if (!content.trim()) {
                showResult('Please enter some content first!', true);
                return;
            }

            try {
                const response = await fetch('/api/paste', {
                    method: 'POST',
                    headers: { 'content-type': 'application/json' },
                    body: JSON.stringify({
                        blobs: [{ content: content, lang: 'plaintext' }]
                    })
                });

                const data = await response.json().catch(() => null);
                if (response.ok && data && data.id) {
                    const url = window.location.origin + '/p/' + data.id;
                    showResult('Paste created! <a href="' + url + '">' + url + '</a>');
                    textarea.value = '';
                    charCount.textContent = '0 characters';
                } else {
                    showResult((data && data.error) || 'Failed to create paste. Please try again.', true);
                }
            } catch (err) {
                showResult('Network error. Please try again.', true);
            }
        }

        function showResult(html, isError = false) {
            const result = document.getElementById('result');
            result.innerHTML = html;
            result.className = 'result show' + (isError ? ' error' : '');
        }

        function viewRaw() {
            const path = window.location.pathname;
            if (path.startsWith('/p/')) {
                window.location.href = '/raw/' + path.slice(3);
            } else {
                showResult('No paste selected. Create or visit a paste first.', true);
            }
        }

        const path = window.location.pathname;
        if (path.startsWith('/p/')) {
            const id = path.slice(3);
            fetch('/raw/' + id)
                .then(r => r.text())
                .then(text => {
                    textarea.value = text;
                    charCount.textContent = text.length + ' characters';
                    document.getElementById('editorTitle').textContent = id + '.txt';
                })
                .catch(() => {
                    showResult('Paste not found.', true);
                });
        }

        /* ---------- cursor from furryfemboys.top ---------- */
        (function () {
            if (matchMedia('(hover: none)').matches) return;
            const cursor = document.getElementById('ffbCursor');
            if (!cursor) return;
            const HALF = 28;
            let tx = 0, ty = 0, cx = 0, cy = 0, raf = null;
            function follow() {
                cx += (tx - cx) * 0.3;
                cy += (ty - cy) * 0.3;
                cursor.style.transform = 'translate(' + (cx - HALF) + 'px,' + (cy - HALF) + 'px)';
                raf = requestAnimationFrame(follow);
            }
            document.addEventListener('mousemove', function (e) {
                tx = e.clientX;
                ty = e.clientY;
                cursor.style.opacity = '1';
                if (!raf) raf = requestAnimationFrame(follow);
            });
            document.addEventListener('mouseleave', function () { cursor.style.opacity = '0'; });
            document.addEventListener('mouseenter', function () { cursor.style.opacity = '1'; });
        })();

        /* ---------- sparkle trail from furryfemboys.top ---------- */
        (function () {
            if (matchMedia('(hover: none)').matches) return;
            const trailChars = [
                'nf-fa-star', 'nf-oct-star', 'nf-cod-star_empty',
                'nf-weather-stars', 'nf-fa-heart_o', 'nf-fa-heart',
                'nf-cod-sparkle', 'nf-cod-sparkle_filled'
            ];
            let last = 0;
            document.addEventListener('mousemove', function (e) {
                const now = Date.now();
                if (now - last < 90) return;
                last = now;
                const s = document.createElement('i');
                s.className = 'ffb-sparkle-trail nf ' + trailChars[Math.floor(Math.random() * trailChars.length)];
                s.style.left = e.clientX + 'px';
                s.style.top = e.clientY + 'px';
                s.style.color = '#ff69b4';
                document.body.appendChild(s);
                setTimeout(function () { s.remove(); }, 900);
            });
        })();
    </script>
</body>
</html>
