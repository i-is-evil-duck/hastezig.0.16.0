<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hastezig</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/">hastezig</a></h1>
    <div class="toolbar">
      <a id="raw-link" class="btn" href="#">raw</a>
      <button id="edit" type="button">edit</button>
      <button id="add-blob" type="button" hidden>+ blob</button>
      <button id="save-new" type="button" hidden>save as new paste</button>
      <button id="cancel-edit" type="button" hidden>cancel</button>
      <a class="theme-switch" href="{{LIGHT_ORIGIN}}/">light theme</a>
    </div>
  </header>

  <main>
    <div id="paste-list"></div>
    <p id="error" class="error" hidden></p>
  </main>

  <script src="/vendor/highlight.min.js"></script>
  <script src="/vendor/zig.min.js"></script>
  <script src="/app.js"></script>
</body>
</html>
