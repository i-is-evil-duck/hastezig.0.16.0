<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>hastezig</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1><a href="/">hastezig</a></h1>
    <span class="tagline">a tiny pastebin</span>
    <a class="theme-switch" href="{{LIGHT_ORIGIN}}/">light theme</a>
  </header>

  <main>
    <form id="paste-form">
      <div class="toolbar toolbar-left">
        <button type="button" id="add-blob">+ Add blob</button>
        <button type="submit">Paste</button>
      </div>
      <div id="blob-list"></div>
      <p id="error" class="error" hidden></p>
    </form>
  </main>

  <script src="/app.js"></script>
</body>
</html>
